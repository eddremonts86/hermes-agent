<!doctype html>
<html lang="en">

      name="viewport"

    <!-- Preconnect to Google Fonts so the Apple default theme's Inter
         webfont fetches start during the browser's HTML parse, not after
         ThemeProvider's first render. Both hostnames are required: the
         CSS lives at googleapis.com and the font files at gstatic.com. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
