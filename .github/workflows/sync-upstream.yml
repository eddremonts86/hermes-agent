name: Weekly upstream sync

# Runs every Monday at 06:00 UTC. Brings NousResearch/hermes-agent changes
# directly into main on this fork.
#
# Why direct push (not a PR):
#   - This is a personal fork; eddremonts86 is the only owner and
#     image consumer. We want zero review ceremony.
#   - If a rebase conflicts, the workflow aborts (does NOT force-push)
#     and creates a manual todo so the user can resolve locally.
#
# Triggers:
#   - schedule:  Monday 06:00 UTC
#   - workflow_dispatch:  manual "Run workflow" from the Actions tab

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add nousresearch https://github.com/NousResearch/hermes-agent.git 2>/dev/null || git remote set-url nousresearch https://github.com/NousResearch/hermes-agent.git
          git fetch nousresearch main --depth=500

      - name: Compute divergence
        id: div
        run: |
          ahead=$(git rev-list --count nousresearch/main..HEAD)
          behind=$(git rev-list --count HEAD..nousresearch/main)
          echo "ahead=$ahead"  >> "$GITHUB_OUTPUT"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Behind upstream: $behind | ahead of upstream: $ahead"

      - name: Skip when already up to date
        if: steps.div.outputs.behind == '0'
        run: |
          echo "✅ origin/main is already up to date with nousresearch/main. Nothing to do."

      - name: Rebase onto upstream and push
        if: steps.div.outputs.behind != '0'
        env:
          BEHIND: ${{ steps.div.outputs.behind }}
        run: |
          set -euo pipefail
          echo "Rebasing $BEHIND upstream commit(s) onto HEAD..."
          # rebase will fail with non-zero if there are conflicts; we DO NOT
          # resolve them automatically, so a conflict leaves the repo clean
          # and the workflow fails loudly for manual intervention.
          git rebase nousresearch/main
          # After a rebase, HEAD is no longer a fast-forward of origin/main,
          # so we MUST force-push. --force-with-lease is safe here because:
          #   1. The remote was just fetched at the start of this job.
          #   2. The only writer to this branch is this workflow (GITHUB_TOKEN).
          # If a concurrent write slipped in, --force-with-lease will refuse
          # and we'll see the failure rather than silently clobbering.
          git push --force-with-lease origin HEAD:main
          echo "✅ Pushed rebase to origin/main."
          echo "ℹ️  docker-publish.yml will rebuild and republish ghcr.io/eddremonts86/hermes-agent."
