name: Manual upstream sync

# Brings NousResearch/hermes-agent changes directly into main on this fork.
# This is a personal fork: upstream sync is opt-in and triggered manually
# from the Actions tab ("Run workflow") whenever eddremonts86 wants to
# pull new upstream commits. There is no schedule.
#
# Why direct push (not a PR):
#   - This is a personal fork; eddremonts86 is the only owner and
#     image consumer. We want zero review ceremony.
#   - If a rebase conflicts, the workflow aborts and eddremonts86
#     resolves it locally.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add nousresearch https://github.com/NousResearch/hermes-agent.git 2>/dev/null || git remote set-url nousresearch https://github.com/NousResearch/hermes-agent.git
          git fetch nousresearch main --depth=500

      - name: Compute divergence
        id: div
        run: |
          ahead=$(git rev-list --count nousresearch/main..HEAD)
          behind=$(git rev-list --count HEAD..nousresearch/main)
          echo "ahead=$ahead"  >> "$GITHUB_OUTPUT"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Behind upstream: $behind | ahead of upstream: $ahead"

      - name: Skip when already up to date
        if: steps.div.outputs.behind == '0'
        run: |
          echo "✅ origin/main is already up to date with nousresearch/main. Nothing to do."

      - name: Rebase onto upstream and push
        if: steps.div.outputs.behind != '0'
        env:
          BEHIND: ${{ steps.div.outputs.behind }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          echo "Rebasing $BEHIND upstream commit(s) onto HEAD..."
          git rebase nousresearch/main

          # After a rebase, head of our local main may include upstream
          # changes to files under .github/workflows/. Pushing those from a
          # GitHub Action (even with a PAT) is blocked by GitHub's workflow-
          # scope protection. Strategy: keep the workflow file changes in
          # the rebase locally, but reset them to the pre-rebase tip on the
          # remote. This is a personal fork, so we don't need upstream's
          # CI workflows.
          if git diff --name-only origin/main HEAD | grep -q '^\.github/workflows/'; then
            echo "⚠️  Upstream brought workflow changes. Restoring origin/main versions on top of the rebase."
            WORKFLOW_FILES=$(git diff --name-only origin/main HEAD | grep '^\.github/workflows/')
            for f in $WORKFLOW_FILES; do
              git checkout origin/main -- "$f"
            done
            git add .github/workflows/
            if ! git diff --cached --quiet; then
              git commit -m "chore(sync): restore fork's workflow files (upstream changes dropped, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...nousresearch:main)"
            fi
          fi

          # Rewrite origin URL with PAT-in-username so the push is attributed
          # to the PAT user (not the GitHub App that owns this workflow).
          PUSH_URL="https://sync-token:${SYNC_TOKEN}@github.com/eddremonts86/hermes-agent.git"
          git remote set-url origin "$PUSH_URL"

          # After a rebase, HEAD is no longer a fast-forward of origin/main,
          # so we MUST force-push. --force-with-lease is safe here because:
          #   1. The remote was just fetched at the start of this job.
          #   2. The only writer to this branch is this workflow (SYNC_TOKEN).
          git push --force-with-lease origin HEAD:main
          echo "✅ Pushed rebase to origin/main."
          echo "ℹ️  docker-publish.yml will rebuild and republish ghcr.io/eddremonts86/hermes-agent."
